name: Deploy latest docs

on:
  push:
    branches:
      - master
      - release/*

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dart:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build docs
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          cd retrofit
          sed -i "s/GA_MEASUREMENT_ID/${GA_MEASUREMENT_ID}/g" doc_header.html
          dart doc
          mv doc/api ../public
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
